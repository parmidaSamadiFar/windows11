  <script>
    f = 0;
    fireFox.ondblclick = function () {
      if (f == 0) {
        fireFoxList.style.opacity = "1";
        fireFoxList.style.visibility = "visible";
        f = 1;
      } else {
        fireFoxList.style.opacity = "0";
        fireFoxList.style.visibility = "hidden";
        f = 0;
      }
    };
  </script>
